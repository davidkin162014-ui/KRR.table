<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Табло вылета</title>
<style>
:root{--bg:#e6e5eb;--tx:#14163a;--mut:#6b6e85;--line:#cfd0da;--g:#138a3d;--y:#f08a00;--b:#f08a00;--r:#e60000;--o:#e8710a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{display:flex;flex-direction:column;font:600 11px/1.15 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#dates{display:flex;gap:4px;padding:6px max(8px,env(safe-area-inset-left)) 4px;flex:none}
.d{flex:1;padding:4px 0;border-radius:8px;background:transparent;color:var(--mut);border:1px solid var(--line);font-size:11px;font-weight:700}
.d.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.row{display:grid;grid-template-columns:12fr 15fr 21fr 14fr 8fr 8fr 22fr;column-gap:6px;align-items:center;padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));min-width:0}
.row>*{min-width:0;overflow:hidden}
#board{flex:1;min-height:0;display:flex;overflow:hidden}
.col{flex:1;min-width:0;display:flex;flex-direction:column}.col+.col{border-left:1px solid var(--line)}
.hd{flex:none;height:22px;color:var(--mut);text-transform:uppercase;font-weight:800;font-size:max(7px,.7em)}
.col .row:not(.hd){border-top:1px solid var(--line)}
.t{font-weight:800;font-size:1.12em}.t s{display:block;color:var(--mut);font-weight:500;font-size:.8em}
.lg{display:block;max-width:100%;object-fit:contain;object-position:left center;width:100%}
.n{font-weight:800;text-align:center;font-size:1.15em}.fl{font-weight:800;font-size:.95em}
.st{font-weight:800;font-size:.85em}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.o{color:var(--o)}.b{color:var(--b)}.m{color:var(--mut)}
.empty{padding:30px;text-align:center;color:var(--mut)}
.c0{font-size:calc(1.12em*var(--k0,1))}.c2{font-size:calc(1em*var(--k2,1));white-space:nowrap}.c2 small{display:block;font-size:.72em;color:var(--mut);font-weight:700}.c3{font-size:calc(.95em*var(--k3,1))}.c6{font-size:calc(.85em*var(--k6,1))}
.hd>*{overflow:visible;white-space:nowrap}
#alert{flex:none;background:var(--r);color:#fff;font-weight:800;padding:6px 10px;font-size:11px;text-align:center;line-height:1.25}#alert.ok{background:var(--g)}
#top{flex:none;display:flex;flex-direction:column}#clk{padding:6px max(8px,env(safe-area-inset-left)) 0;display:flex;align-items:baseline;gap:8px;font-weight:800;flex:none}#clk b{font-size:20px;letter-spacing:.5px}#clk span{font-size:13px;color:var(--mut)}
@media(orientation:landscape){#top{flex-direction:row;align-items:center}#clk{padding-top:0}#dates{flex:1}}
#ov[hidden]{display:none}#ov{position:fixed;inset:0;z-index:9;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:clamp(16px,4.2vw,26px);font-weight:800;line-height:1.3}
</style></head><body>
<div id="top"><div id="clk"></div><div id="dates"></div></div>
<div id="board"></div>
<div id="ov" hidden></div>

  }));
}
function VH(){let h=innerHeight;if(matchMedia("(orientation:landscape)").matches){const s=Math.min(screen.width,screen.height);if(h>s-60)h=s-100}if(visH>50)h=Math.min(h,visH);return Math.max(150,h)}
function fit(bd){[0,2,3,6].forEach(k=>{let r=1;bd.style.removeProperty("--k"+k);bd.querySelectorAll(".c"+k).forEach(e=>{if(e.scrollWidth>e.clientWidth+1)r=Math.min(r,e.clientWidth/e.scrollWidth)});bd.style.setProperty("--k"+k,r<1?(r*.96).toFixed(3):1)})}
function render(){
  const L=T[lang],bd=document.getElementById("board"),H=VH();
  document.body.style.height=H+"px";
  const cols=innerWidth/H>1.5?2:1,av=bd.clientHeight-22;
  const live=sel===simDay;let list=[];
  if(sel>=simDay)DAYS[sel].forEach(f=>{const i=info(f,sel,simMin,live);if(i.vis!==false)list.push([f,i])});
  const comfy=cols*Math.max(1,Math.floor(av/54)),max=cols*Math.max(1,Math.floor(av/26));
  if(live)for(const f of DAYS[(sel+1)%4]){if(list.length>=comfy)break;list.push([f,info(f,0,0,false)])}
  list=list.slice(0,max);
  const per=Math.ceil(list.length/cols)||1,rh=Math.min(av/per,100),fs=Math.max(8,Math.min(rh*.3,innerWidth/cols/37));
  const head=`<div class="row hd">${L.h.map((x,i)=>`<div style="${i>3&&i<6?"text-align:center":""}">${x}</div>`).join("")}</div>`;
  const row=([f,i])=>`<div class="row" style="height:${rh}px"><div class="t c0">${i.dl?`<s>${f[0]}</s>${fm(i.E)}`:f[0]}</div><div><img class="lg" style="height:${rh*.5}px" src="${LOGO[f[3]]}" alt=""></div><div class="c2" style="font-weight:800">${lang==="en"?EN[f[2]]:f[1]}${["SVO","DME","VKO"].includes(f[2])?`<small>(${f[2]})</small>`:""}</div><div class="fl c3">${f[4]}</div><div class="n">${i.desk}</div><div class="n">${i.gate}</div><div class="st c6 ${i.c}">${i.k==="dly"||i.k==="pp"?L[i.k]+fm(i.E):L[i.k]}</div></div>`;
  let html="";
  for(let c=0;c<cols;c++)html+=`<div class="col" style="font-size:${fs}px">${head}${list.slice(c*per,(c+1)*per).map(row).join("")}</div>`;
  bd.innerHTML=list.length?html:`<div class="empty">${L.none}</div>`;
  fit(bd);
}
const MN={ru:["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"],en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const dl_=(d,l)=>l==="en"?MN.en[d.getMonth()]+" "+d.getDate():d.getDate()+" "+MN.ru[d.getMonth()];
function clock(){const x=(simMin+(Date.now()-lastTick)/15000*SPEED_MIN)%1440;document.getElementById("clk").innerHTML=`<b>${fm(x)}</b><span>${dl_(new Date(2026,10,17+tot),lang)}</span>`}
function dates(){
  const L=T[lang];
  document.getElementById("dates").innerHTML=DAYS.map((_,i)=>{const d=new Date(2026,10,17+Math.floor(tot/4)*4+i);return `<button class="d ${i===sel?"on":""}" data-i="${i}">${dl_(d,lang)} · ${L.wd[d.getDay()]}</button>`}).join("");
  document.querySelectorAll(".d").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;dates();render()});
  clock();
}
const ov=document.getElementById("ov");
let ovT;
function startDrone(){
  held={};DAYS.forEach((day,di)=>day.forEach(f=>{if(di!==simDay)return;const i=info(f,di,simMin,true);if(i.vis!==false&&["rg","rge","rgc","brd","fin","cls"].includes(i.k))held[di+f[4]+f[0]]=1}));
  drone={start:simMin,end:simMin+120+Math.random()*120};push(true);
  clearTimeout(ovT);ov.innerHTML=T.ru.alb;ov.hidden=false;ovT=setTimeout(()=>{ov.innerHTML=T.en.alb;ovT=setTimeout(()=>{ov.hidden=true},10000)},10000);
}
function endDrone(){
  DAYS.forEach((day,di)=>day.forEach(f=>{if(di!==simDay)return;const k=di+f[4]+f[0];if(!held[k])return;const i=info(f,di,simMin,true);if(i.vis===false)return;if(i.E<simMin+25)extra[k]=(extra[k]||0)+simMin+25-i.E}));
  drone=null;held={};
}
function tick(){
  lang=lang==="ru"?"en":"ru";simMin+=SPEED_MIN;lastTick=Date.now();
  if(simMin>=1440){simMin-=1440;const fl=sel===simDay;tot++;simDay=tot%4;if(fl)sel=simDay;for(const m of [extra,canc])for(const k in m)if(k[0]==simDay)delete m[k];if(drone){drone.start-=1440;drone.end-=1440}}
  if(drone){if(simMin>=drone.end)endDrone();else push(false)}
  else{const hr=Math.floor(simMin/60),night=hr>=22||hr<6;if(Math.random()<(night?.02:.004))startDrone()}
  dates();render();
}
ov.onclick=()=>{ov.hidden=true};
let taps=[];
document.getElementById("board").addEventListener("click",()=>{const t=Date.now();taps=taps.filter(x=>t-x<700);taps.push(t);if(taps.length>=3){taps=[];drone?endDrone():startDrone();render()}});
dates();render();
setInterval(tick,15000);setInterval(clock,1000);
addEventListener("resize",render);
addEventListener("orientationchange",()=>setTimeout(render,300));
try{const p=document.createElement("div");p.style.cssText="position:fixed;left:0;top:0;width:1px;height:100vh;pointer-events:none";document.body.append(p);
new IntersectionObserver(es=>{const h=es[es.length-1].intersectionRect.height;if(h>50&&Math.abs(h-visH)>4){visH=h;render()}},{threshold:Array.from({length:21},(_,i)=>i/20)}).observe(p)}catch(e){}
</script></body></html>
